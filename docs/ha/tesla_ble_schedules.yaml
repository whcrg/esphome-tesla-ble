# =====================================================================================================
# Tesla BLE - schedules and preconditioning for Home Assistant (single package file)
#
# What you get:
#   - sensor.tesla_charge_schedules / sensor.tesla_precondition_schedules (state = count, attributes
#     `schedules` = the list read from the car, `read_at` = when it was read)
#   - sensor.tesla_next_departure: the next departure at Home, plus `all_upcoming` (next 72 h) with each
#     departure's charge request. Meant for external charging planners (no bitmask/one-time parsing needed)
#   - scripts to wake the car, refresh the lists, add/edit/delete schedules and precondition now
#   - an automation that re-reads the lists whenever the car is awake and the last read is over an hour old
#   - an offline queue: saves and deletes made while the car is out of reach are kept in
#     sensor.tesla_schedule_queue and sent when it is next in range (one-time schedules that have passed are dropped)
#   - optional cleanup of one-time schedules that have run (the car keeps them; input_select.tesla_one_time_cleanup)
#   - "also charge for this departure" on precondition schedules, handled either by a linked car charge
#     schedule or by an external planner (input_select.tesla_charge_scheduling)
#   - a schedule editor (helpers + automations) used by docs/ha/tesla_ble_dashboard.yaml
#
# Install:
#   1. configuration.yaml:   homeassistant:
#                              packages: !include_dir_named packages
#   2. Save this file as /config/packages/tesla_ble_schedules.yaml
#   3. Your ESPHome device name is assumed to be `tesla-ble` (entities `*.tesla_ble_*`, actions
#      `esphome.tesla_ble_*`). If yours differs, search-and-replace `tesla_ble_` in this file.
#   4. Developer tools > YAML > Check configuration, then restart Home Assistant (first install)
#   5. In the ESPHome integration, device options: enable "Allow the device to perform Home Assistant
#      actions" (the schedule lists arrive as events).
#   6. Setting schedules needs `allow_setting_schedules: 1` under `tesla_ble_vehicle:` in the ESPHome yaml.
#
# Days are a bitmask: Sun = 1, Mon = 2, Tue = 4, Wed = 8, Thu = 16, Fri = 32, Sat = 64.
#
# Charging for a departure: a precondition schedule can carry a charge request (a window, for example
# 01:00-07:00, and optionally a target %). The car does not store anything like it, so the requests live in
# Home Assistant: sensor.tesla_charge_requests, keyed by precondition schedule ID, fed by the
# `tesla_ble_departure_changed` event that the set and delete scripts fire. With "Car charge schedules" the
# reconcile automation keeps a car charge schedule named `pc:<precondition id>` in step with each request, and
# the car's charge limit is set to the target when the window starts. With "External planner" no car charge
# schedules are kept at Home and the charge limit is left alone (both conflict with external smart charging);
# the request is only published in sensor.tesla_next_departure and the event.
# =====================================================================================================

template:
  # The car keeps one-time schedules listed after they have run; sensor.tesla_schedule_queue marks those `ran`.
  - triggers:
      - trigger: event
        event_type: esphome.tesla_schedules_updated
    sensor:
      - name: Tesla charge schedules
        unique_id: tesla_charge_schedules
        icon: mdi:ev-station
        state: "{{ trigger.event.data.count }}"
        attributes:
          schedules: "{{ (trigger.event.data.schedules | from_json).charge_schedules }}"
          read_at: "{{ now().isoformat() }}"   # when the car's list arrived; kept across HA restarts
  - triggers:
      - trigger: event
        event_type: esphome.tesla_precondition_schedules_updated
    sensor:
      - name: Tesla precondition schedules
        unique_id: tesla_precondition_schedules
        icon: mdi:car-clock
        state: "{{ trigger.event.data.count }}"
        attributes:
          schedules: "{{ (trigger.event.data.schedules | from_json).precondition_schedules }}"
          read_at: "{{ now().isoformat() }}"   # when the car's list arrived; kept across HA restarts

  # Charge requests of precondition schedules: {"<schedule id>": {start, end, target, seen}}, start/end "HH:MM".
  # Set and cleared by `tesla_ble_departure_changed`; a request whose schedule has not been in the car's list
  # for 7 days is dropped (the schedule was deleted elsewhere). Kept across Home Assistant restarts.
  # `saved_at` ({"precondition:<id>" or "charge:<id>": ISO time}) records when each schedule was last saved, which
  # is when a one-time schedule is set up again: from the package's set scripts, from the event
  # `tesla_ble_schedule_saved` (data: kind, schedule_id; for automations that write to the car directly), and
  # from any read in which a schedule's settings differ from the previous read (the Tesla app, the car's screen).
  - triggers:
      - trigger: event
        event_type:
          - tesla_ble_departure_changed
          - tesla_ble_schedule_saved
      - trigger: state
        entity_id:
          - sensor.tesla_precondition_schedules
          - sensor.tesla_charge_schedules
    actions:
      - variables:
          requests: >-
            {#- `this` is not available in actions: read the previous value from the state machine -#}
            {%- set old = state_attr('sensor.tesla_charge_requests', 'requests') -%}
            {%- set old = old if old is mapping else {} -%}
            {%- set ns = namespace(d={}) -%}
            {%- if trigger.platform == 'event' and trigger.event.event_type == 'tesla_ble_schedule_saved' -%}
              {%- set ns.d = old -%}
            {%- elif trigger.platform == 'event' -%}
              {%- set sid = trigger.event.data.schedule_id | string -%}
              {%- for k, v in old.items() if k != sid -%}{%- set ns.d = dict(ns.d, **{k: v}) -%}{%- endfor -%}
              {%- set e = trigger.event.data -%}
              {%- if e.change == 'saved' and e.charge and e.charge_start and e.charge_end -%}
                {%- set ns.d = dict(ns.d, **{sid: {'start': e.charge_start, 'end': e.charge_end,
                                                  'target': e.charge_target, 'seen': now().isoformat()}}) -%}
              {%- endif -%}
            {%- else -%}
              {%- set pre = state_attr('sensor.tesla_precondition_schedules', 'schedules') -%}
              {%- set ids = (pre if pre is list else []) | map(attribute='id') | map('string') | list -%}
              {%- for k, v in old.items() -%}
                {%- if k in ids -%}{%- set ns.d = dict(ns.d, **{k: dict(v, seen=now().isoformat())}) -%}
                {%- elif (v.seen | as_datetime(now())) > now() - timedelta(days=7) -%}{%- set ns.d = dict(ns.d, **{k: v}) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {{- ns.d -}}
          saved_at: >-
            {%- set old = state_attr('sensor.tesla_charge_requests', 'saved_at') -%}
            {%- set old = old if old is mapping else {} -%}
            {%- set ids = namespace(l=[]) -%}
            {%- for kind in ['precondition', 'charge'] -%}
              {%- set l = state_attr('sensor.tesla_' ~ kind ~ '_schedules', 'schedules') -%}
              {%- for s in (l if l is list else []) -%}{%- set ids.l = ids.l + [kind ~ ':' ~ s.id] -%}{%- endfor -%}
            {%- endfor -%}
            {%- set ns = namespace(d={}, now=[], key='') -%}
            {%- if trigger.platform == 'event' -%}
              {%- set e = trigger.event.data -%}
              {%- set ns.key = (e.kind | default('precondition')) ~ ':' ~ e.schedule_id -%}
              {%- if e.change | default('saved') == 'saved' -%}{%- set ns.now = [ns.key] -%}{%- endif -%}
            {%- else -%}
              {#- a list was read: schedules whose settings differ from the previous read were changed elsewhere -#}
              {%- set kind = 'charge' if trigger.entity_id == 'sensor.tesla_charge_schedules' else 'precondition' -%}
              {%- set before = trigger.from_state.attributes.schedules if trigger.from_state else none -%}
              {%- set after = trigger.to_state.attributes.schedules if trigger.to_state else none -%}
              {%- if before is list and after is list -%}
                {%- for s in after -%}
                  {%- set p = before | selectattr('id', 'eq', s.id) | list -%}
                  {%- if p and p[0] != s -%}{%- set ns.now = ns.now + [kind ~ ':' ~ s.id] -%}{%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endif -%}
            {%- for k, v in old.items() if k != ns.key and k not in ns.now
                and (k in ids.l or (v | as_datetime(now())) > now() - timedelta(days=7)) -%}
              {%- set ns.d = dict(ns.d, **{k: v}) -%}{%- endfor -%}
            {%- for k in ns.now -%}{%- set ns.d = dict(ns.d, **{k: now().isoformat()}) -%}{%- endfor -%}
            {{- ns.d -}}
    sensor:
      - name: Tesla charge requests
        unique_id: tesla_charge_requests
        icon: mdi:ev-plug-type2
        state: "{{ requests | count }}"
        attributes:
          requests: "{{ requests }}"
          saved_at: "{{ saved_at }}"

  # Changes waiting for the car: saves and deletes made while it was out of reach. `pending` is a list of
  # {kind, op, schedule_id, payload, queued_at}; payload is the ESPHome action data. A newer change to the same
  # schedule replaces an older one. Saves of one-time schedules whose run has passed are dropped. Also publishes
  # the schedule lists as they will be once uploaded (`precondition_schedules`, `charge_schedules`; queued
  # entries have `pending: true`), which the editor, the card and sensor.tesla_next_departure use.
  - triggers:
      - trigger: event
        event_type: tesla_ble_schedule_queue
      - trigger: state
        entity_id:
          - sensor.tesla_precondition_schedules
          - sensor.tesla_charge_schedules
          - sensor.tesla_charge_requests
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          car_pre: >-
            {%- set p = state_attr('sensor.tesla_precondition_schedules', 'schedules') -%}{{ p if p is list else [] -}}
          car_ch: >-
            {%- set c = state_attr('sensor.tesla_charge_schedules', 'schedules') -%}{{ c if c is list else [] -}}
          pending: >-
            {#- `this` is not available in actions: read the previous value from the state machine -#}
            {%- set old = state_attr('sensor.tesla_schedule_queue', 'pending') -%}
            {%- set ns = namespace(l=old if old is list else []) -%}
            {%- if trigger.platform == 'event' -%}
              {%- set e = trigger.event.data -%}
              {%- set sid = e.schedule_id | string -%}
              {%- set keep = namespace(l=[]) -%}
              {%- for i in ns.l -%}
                {%- set same = i.kind == e.kind and i.schedule_id | string == sid -%}
                {%- if not same or (e.action == 'remove' and e.queued_at is defined and i.queued_at != e.queued_at) -%}
                  {%- set keep.l = keep.l + [i] -%}{%- endif -%}
              {%- endfor -%}
              {%- set ns.l = keep.l -%}
              {%- if e.action == 'add' -%}
                {%- set on_car = ((car_pre if e.kind == 'precondition' else car_ch) | map(attribute='id') | map('string') | list) -%}
                {#- deleting a schedule that only existed in the queue just drops it from the queue -#}
                {%- if e.op != 'delete' or sid in on_car -%}
                  {%- set ns.l = ns.l + [{'kind': e.kind, 'op': e.op, 'schedule_id': sid, 'payload': e.payload | default({}),
                                         'queued_at': now().isoformat()}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endif -%}
            {#- drop saves of one-time schedules whose run (the first one after the save) has passed -#}
            {%- macro next_run(base, t, days) -%}
              {#- first ready time t (minutes) after base on one of the days (bitmask; 0 = any day) -#}
              {%- set nr = namespace(r=none) -%}
              {%- for i in range(0, 8) -%}
                {%- set c = (base + timedelta(days=i)).replace(hour=(t // 60) % 24, minute=t % 60, second=0, microsecond=0) -%}
                {%- if nr.r is none and c > base and (days == 0 or (days // (2 ** ((c.weekday() + 1) % 7))) % 2 == 1) -%}
                  {%- set nr.r = c -%}{%- endif -%}
              {%- endfor -%}{{- nr.r.isoformat() if nr.r else '' -}}
            {%- endmacro -%}
            {%- set out = namespace(l=[]) -%}
            {%- for i in ns.l -%}
              {%- set p = i.payload -%}
              {%- set past = false -%}
              {%- if i.op == 'set' and p.one_time | default(false) -%}
                {%- set t = p.precondition_time if i.kind == 'precondition'
                            else (p.end_time if p.end_enabled | default(true) else p.start_time) -%}
                {%- set r = next_run(as_local(i.queued_at | as_datetime), t, p.days_of_week | default(0)) | as_datetime(none) -%}
                {%- set past = r is not none and r < now() -%}
              {%- endif -%}
              {%- if not past -%}{%- set out.l = out.l + [i] -%}{%- endif -%}
            {%- endfor -%}
            {{- out.l -}}
      - variables:
          # The car's lists with the queued changes applied, in the car's own format
          merged: >-
            {%- macro days(b) -%}
              {%- set n = namespace(l=[]) -%}
              {%- for d in ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] -%}
                {%- if (b // (2 ** loop.index0)) % 2 == 1 -%}{%- set n.l = n.l + [d] -%}{%- endif -%}
              {%- endfor -%}{{- n.l | join(', ') -}}
            {%- endmacro -%}
            {%- macro hhmm(t) -%}{{- '%02d:%02d' % ((t // 60) % 24, t % 60) -}}{%- endmacro -%}
            {%- macro next_run(base, t, days) -%}
              {#- first ready time t (minutes) after base on one of the days (bitmask; 0 = any day) -#}
              {%- set nr = namespace(r=none) -%}
              {%- for i in range(0, 8) -%}
                {%- set c = (base + timedelta(days=i)).replace(hour=(t // 60) % 24, minute=t % 60, second=0, microsecond=0) -%}
                {%- if nr.r is none and c > base and (days == 0 or (days // (2 ** ((c.weekday() + 1) % 7))) % 2 == 1) -%}
                  {%- set nr.r = c -%}{%- endif -%}
              {%- endfor -%}{{- nr.r.isoformat() if nr.r else '' -}}
            {%- endmacro -%}
            {%- set saved = state_attr('sensor.tesla_charge_requests', 'saved_at') -%}
            {%- set saved = saved if saved is mapping else {} -%}
            {%- set out = namespace(pre=[], ch=[]) -%}
            {%- for kind, car in [('precondition', car_pre), ('charge', car_ch)] -%}
              {%- set q = pending | selectattr('kind', 'eq', kind) | list -%}
              {%- set qids = q | map(attribute='schedule_id') | map('int') | list -%}
              {#- One-time schedules: `run_at` is their single run, the first ready time on one of their days after
                  they were created or last saved (sensor.tesla_charge_requests saved_at); `ran` once it has passed.
                  The car keeps them listed after they run. -#}
              {%- set ns = namespace(l=[]) -%}
              {%- for s in car | rejectattr('id', 'in', qids) -%}
                {%- set run = none -%}
                {%- if s.one_time -%}
                  {%- set t = s.precondition_time if kind == 'precondition' else (s.end_time if s.end_enabled else s.start_time) -%}
                  {%- set base = as_local(as_datetime(s.id)) if s.id >= 1600000000 else now() -%}
                  {%- set sv = saved.get(kind ~ ':' ~ s.id) | as_datetime(none) -%}
                  {%- if sv -%}{%- set base = [base, as_local(sv)] | max -%}{%- endif -%}
                  {%- set run = next_run(base, t, s.days) | as_datetime(none) -%}
                {%- endif -%}
                {%- set ran = run is not none and run < now() -%}
                {%- set ns.l = ns.l + [dict(s, ran=ran, run_at=run.isoformat() if run else none)] -%}
              {%- endfor -%}
              {%- for i in q if i.op == 'set' -%}
                {%- set p = i.payload -%}
                {%- set e = {'id': i.schedule_id | int, 'name': p.name | default(''), 'days': p.days_of_week,
                             '*days': days(p.days_of_week), 'one_time': p.one_time, 'enabled': p.enabled,
                             'latitude': p.latitude, 'longitude': p.longitude, 'pending': true, 'ran': false} -%}
                {%- if p.one_time -%}
                  {%- set t = p.precondition_time if kind == 'precondition' else (p.end_time if p.end_enabled else p.start_time) -%}
                  {%- set e = dict(e, run_at=next_run(as_local(i.queued_at | as_datetime), t, p.days_of_week) or none) -%}
                {%- endif -%}
                {%- if kind == 'precondition' -%}
                  {%- set e = dict(e, precondition_time=p.precondition_time, **{'*precondition_time': hhmm(p.precondition_time)}) -%}
                {%- else -%}
                  {%- set e = dict(e, start_enabled=p.start_enabled, start_time=p.start_time, end_enabled=p.end_enabled,
                                   end_time=p.end_time, **{'*start_time': hhmm(p.start_time), '*end_time': hhmm(p.end_time)}) -%}
                {%- endif -%}
                {%- set ns.l = ns.l + [e] -%}
              {%- endfor -%}
              {%- if kind == 'precondition' -%}{%- set out.pre = ns.l -%}{%- else -%}{%- set out.ch = ns.l -%}{%- endif -%}
            {%- endfor -%}
            {{- {'precondition': out.pre, 'charge': out.ch} -}}
    sensor:
      - name: Tesla schedule queue
        unique_id: tesla_schedule_queue
        icon: mdi:timer-sand
        state: "{{ pending | count }}"
        attributes:
          pending: "{{ pending }}"
          precondition_schedules: "{{ merged.precondition }}"
          charge_schedules: "{{ merged.charge }}"

  # Next departures resolved from the precondition schedules (the merged lists of sensor.tesla_schedule_queue).
  - triggers:
      - trigger: state
        entity_id:
          - sensor.tesla_precondition_schedules
          - sensor.tesla_charge_requests
          - sensor.tesla_schedule_queue
      - trigger: state
        entity_id: input_select.tesla_charge_scheduling
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          upcoming: >-
            {%- set pre = state_attr('sensor.tesla_schedule_queue', 'precondition_schedules') -%}{%- set pre = pre if pre is list else state_attr('sensor.tesla_precondition_schedules', 'schedules') -%}
            {%- set pre = pre if pre is list else [] -%}
            {%- set reqs = state_attr('sensor.tesla_charge_requests', 'requests') -%}
            {%- set reqs = reqs if reqs is mapping else {} -%}
            {%- set n = now() -%}
            {%- set horizon = n + timedelta(hours=72) -%}
            {%- set out = namespace(l=[]) -%}
            {%- for s in pre if s.enabled and not s.ran | default(false) -%}
              {%- set hh = (s.precondition_time // 60) % 24 -%}{%- set mm = s.precondition_time % 60 -%}
              {%- set runs = namespace(l=[]) -%}
              {%- if s.one_time -%}
                {#- its single run, worked out by sensor.tesla_schedule_queue -#}
                {%- set r = s.run_at | default(none) | as_datetime(none) -%}
                {%- set runs.l = [as_local(r)] if r else [] -%}
              {%- else -%}
                {%- for d in range(0, 4) -%}
                  {%- set r = n.replace(hour=hh, minute=mm, second=0, microsecond=0) + timedelta(days=d) -%}
                  {%- if (s.days // (2 ** ((r.weekday() + 1) % 7))) % 2 == 1 -%}{%- set runs.l = runs.l + [r] -%}{%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {%- set rq = reqs.get(s.id | string) -%}
              {%- set z = namespace(best='', d=99999) -%}
              {%- for zone in states.zone if zone.attributes.latitude is defined -%}
                {%- set dz = distance(s.latitude, s.longitude, zone.entity_id) -%}
                {%- if dz is number and dz <= [zone.attributes.radius | default(100) / 1000, 0.5] | max and dz < z.d -%}
                  {%- set z.best = zone.entity_id -%}{%- set z.d = dz -%}{%- endif -%}
              {%- endfor -%}
              {%- for r in runs.l if n < r <= horizon -%}
                {%- if rq -%}
                  {%- set e = r.replace(hour=rq.end[:2] | int, minute=rq.end[3:5] | int) -%}
                  {%- set e = e - timedelta(days=1) if e > r else e -%}
                  {%- set st = e.replace(hour=rq.start[:2] | int, minute=rq.start[3:5] | int) -%}
                  {%- set st = st - timedelta(days=1) if st > e else st -%}
                {%- endif -%}
                {%- set out.l = out.l + [{
                      'at': r.isoformat(),
                      'schedule_id': s.id,
                      'name': s.name | default(''),
                      'one_time': s.one_time,
                      'location': z.best if z.best else 'other',
                      'latitude': s.latitude, 'longitude': s.longitude,
                      'charge': rq is not none,
                      'charge_start': st.isoformat() if rq else none,
                      'charge_end': e.isoformat() if rq else none,
                      'charge_target': (rq.target | int) if rq and rq.target else none,
                      'pending': s.pending | default(false)}] -%}
              {%- endfor -%}
            {%- endfor -%}
            {{- out.l | sort(attribute='at') -}}
    sensor:
      - name: Tesla next departure
        unique_id: tesla_next_departure
        icon: mdi:car-clock
        device_class: timestamp
        # Next enabled departure within the Home zone in the next 72 h, or unknown
        state: "{{ (upcoming | selectattr('location', 'eq', 'zone.home') | map(attribute='at') | first) | default(none) }}"
        attributes:
          all_upcoming: "{{ upcoming }}"
          charge_scheduling: "{{ states('input_select.tesla_charge_scheduling') }}"

# ----------------------------------------------------------------------------- settings and editor helpers
input_select:
  tesla_one_time_cleanup:
    name: Tesla one-time schedules
    icon: mdi:broom
    # The car keeps one-time schedules (still enabled) after they run. "Delete after they run": the cleanup
    # automation deletes them from the car 15 min after their run, while the car is awake and in range.
    options:
      - Keep in the car
      - Delete after they run
  tesla_charge_scheduling:
    name: Tesla charge scheduling
    icon: mdi:ev-plug-type2
    # "Car charge schedules": "also charge" on a precondition schedule keeps a linked car charge schedule.
    # "External planner": no car charge schedules are kept; charge requests go to sensor.tesla_next_departure.
    options:
      - Car charge schedules
      - External planner
  tesla_schedule_select:
    name: Tesla schedule
    icon: mdi:calendar-search
    # Rebuilt from the schedule sensors by the "sync list" automation. Saved schedules end with " · #<id>".
    options:
      - "➕ New precondition schedule"
      - "➕ New charge schedule"
  tesla_schedule_type:
    name: Tesla schedule type
    icon: mdi:shape
    options:
      - precondition
      - charge
  tesla_schedule_location:
    name: Tesla schedule location
    icon: mdi:map-marker
    # Filled by the "load selection" automation: your zones (Home first), plus "📍 Keep: …" for a
    # schedule that is not in any zone, so editing it does not move it.
    options:
      - Home

input_datetime:
  tesla_schedule_time:
    name: Tesla schedule time   # precondition "ready at" / charge start
    has_time: true
    icon: mdi:clock-start
  tesla_schedule_end:
    name: Tesla schedule end    # charge end (also the end of a precondition schedule's charge window)
    has_time: true
    icon: mdi:clock-end
  tesla_schedule_charge_start:
    name: Tesla schedule charge from   # start of a precondition schedule's charge window
    has_time: true
    icon: mdi:clock-start

input_boolean:
  tesla_schedule_start_enabled: { name: Tesla schedule use start, icon: mdi:clock-start }
  tesla_schedule_end_enabled: { name: Tesla schedule use end, icon: mdi:clock-end }
  tesla_schedule_one_time: { name: Tesla schedule one time, icon: mdi:numeric-1-circle }
  tesla_schedule_enabled: { name: Tesla schedule enabled, icon: mdi:check-circle }
  tesla_schedule_also_charge: { name: Tesla schedule also charge, icon: mdi:ev-station }
  tesla_schedule_day_mon: { name: Mon, icon: mdi:calendar-week }
  tesla_schedule_day_tue: { name: Tue, icon: mdi:calendar-week }
  tesla_schedule_day_wed: { name: Wed, icon: mdi:calendar-week }
  tesla_schedule_day_thu: { name: Thu, icon: mdi:calendar-week }
  tesla_schedule_day_fri: { name: Fri, icon: mdi:calendar-week }
  tesla_schedule_day_sat: { name: Sat, icon: mdi:calendar-weekend }
  tesla_schedule_day_sun: { name: Sun, icon: mdi:calendar-weekend }

input_number:
  tesla_schedule_charge_target:
    name: Tesla schedule charge to   # charge target of a precondition schedule's charge request
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-charging-80

# ------------------------------------------------------------------------------------------- scripts
script:
  tesla_ensure_awake:
    alias: Tesla - ensure awake
    description: >-
      Wakes the car if it is asleep and waits until it reports awake. Fails if it does not wake within
      60 s, so callers never send commands to a sleeping car. Every script below calls this first.
    icon: mdi:sleep-off
    mode: single
    max_exceeded: silent
    sequence:
      - if:
          - condition: state
            entity_id: binary_sensor.tesla_ble_asleep
            state: "off"
        then:
          - stop: Car already awake
      - action: button.press
        target:
          entity_id: button.tesla_ble_wake_up
      - wait_template: "{{ is_state('binary_sensor.tesla_ble_asleep', 'off') }}"
        timeout:
          seconds: 60
        continue_on_timeout: true
      - if:
          - condition: not
            conditions:
              - condition: state
                entity_id: binary_sensor.tesla_ble_asleep
                state: "off"
        then:
          - stop: Car did not wake up within 60 s
            error: true
      - delay:
          seconds: 5   # let the infotainment system settle before commands arrive

  tesla_try_wake:
    alias: Tesla - try to wake
    description: >-
      Like "ensure awake", but never fails: returns {awake: true/false}. Gives up at once when the car is out of
      BLE range. Used by the set and delete scripts, which queue the change when the car can't be reached.
    icon: mdi:sleep-off
    mode: parallel
    sequence:
      - variables:
          result: { awake: false }
      - if:
          - condition: state
            entity_id: binary_sensor.tesla_ble_ble_status
            state: "off"
        then:
          - stop: Car out of BLE range
            response_variable: result
      - if:   # asleep, or not known yet (just back in range)
          - condition: not
            conditions:
              - condition: state
                entity_id: binary_sensor.tesla_ble_asleep
                state: "off"
        then:
          - action: button.press
            target:
              entity_id: button.tesla_ble_wake_up
          - wait_template: "{{ is_state('binary_sensor.tesla_ble_asleep', 'off') }}"
            timeout:
              seconds: 60
            continue_on_timeout: true
          - if:
              - condition: state
                entity_id: binary_sensor.tesla_ble_asleep
                state: "off"
            then:
              - delay:
                  seconds: 5   # let the infotainment system settle before commands arrive
      - variables:
          result: { awake: "{{ is_state('binary_sensor.tesla_ble_asleep', 'off') }}" }
      - stop: Done
        response_variable: result

  tesla_refresh_schedules:
    alias: Tesla - refresh schedule lists
    description: Reads both schedule lists from the car; the sensors update when the events arrive.
    icon: mdi:refresh
    mode: single
    sequence:
      - action: script.tesla_ensure_awake
      - action: esphome.tesla_ble_get_charge_schedules
      - action: esphome.tesla_ble_get_precondition_schedules

  tesla_precondition_now:
    alias: Tesla - precondition now
    description: Starts climate (preconditioning) now at the given cabin temperature.
    icon: mdi:car-defrost-front
    mode: single
    fields:
      temperature:
        name: Temperature
        required: true
        default: 21
        selector:
          number: { min: 15, max: 28, step: 0.5, unit_of_measurement: "°C" }
    sequence:
      - action: script.tesla_ensure_awake
      - action: esphome.tesla_ble_start_preconditioning
        data:
          temperature: "{{ temperature | default(0) }}"

  tesla_set_precondition_schedule:
    alias: Tesla - add or edit precondition schedule
    description: >-
      Adds a preconditioning (departure) schedule, or edits the one with the given ID. The car only runs a
      schedule when it is parked near its location: pick a zone, or give latitude/longitude (these win).
      Optionally also requests charging for the departure (see the top of this file); leaving "Charge" out
      keeps the schedule's current request. Fires `tesla_ble_departure_changed`. If the car can't be reached,
      the change is queued and sent when it is next in range.
    icon: mdi:car-clock
    mode: queued
    fields:
      schedule_id:
        name: Schedule ID
        description: Empty adds a new schedule, an existing ID edits it
        selector: { text: }
      name:
        name: Name
        description: Optional (the car may not keep it)
        selector: { text: }
      time:
        name: Ready at
        required: true
        selector: { time: }
      days:
        name: Days
        required: true
        default: [Sun, Mon, Tue, Wed, Thu, Fri, Sat]   # every day: a weekday-only default is easy to miss before a weekend trip
        selector:
          select:
            multiple: true
            options: [Sun, Mon, Tue, Wed, Thu, Fri, Sat]
      one_time:
        name: One time
        required: true
        default: true   # one-time by default: a forgotten weekly schedule keeps running unnoticed
        selector: { boolean: }
      enabled:
        name: Enabled
        required: true
        default: true
        selector: { boolean: }
      location:
        name: Location
        required: true
        default: zone.home
        selector: { entity: { domain: zone } }
      latitude:
        name: Latitude (overrides location)
        selector: { number: { min: -90, max: 90, step: any, mode: box } }
      longitude:
        name: Longitude (overrides location)
        selector: { number: { min: -180, max: 180, step: any, mode: box } }
      charge:
        name: Charge
        description: Also charge for this departure. Leave out to keep the current request
        selector: { boolean: }
      charge_start:
        name: Charge from
        selector: { time: }
      charge_end:
        name: Charge until
        description: Defaults to the ready time
        selector: { time: }
      charge_target:
        name: Charge to
        description: Optional target %
        selector: { number: { min: 50, max: 100, step: 1, unit_of_measurement: "%" } }
    sequence:
      - variables: &schedule_common_vars
          day_bits: { Sun: 1, Mon: 2, Tue: 4, Wed: 8, Thu: 16, Fri: 32, Sat: 64 }
          bits: >-
            {%- set ns = namespace(b=0) -%}{%- for d in days -%}{%- set ns.b = ns.b + day_bits[d] -%}{%- endfor -%}{{ ns.b -}}
          zone: "{{ location | default('zone.home') }}"
          lat: "{{ latitude if latitude is defined and latitude is number else state_attr(zone, 'latitude') }}"
          lon: "{{ longitude if longitude is defined and longitude is number else state_attr(zone, 'longitude') }}"
      - variables:
          kind: precondition
      - variables: &moved_vars
          # The car keeps a schedule's location when it is edited, so a schedule moved elsewhere is replaced:
          # the old one is deleted and a new one added, which takes over its charge request.
          moved_from: >-
            {%- set l = state_attr('sensor.tesla_schedule_queue', kind ~ '_schedules') -%}
            {%- set e = (l if l is list else []) | selectattr('id', 'eq', schedule_id | default('') | int(0)) | list -%}
            {{- e[0].id if e and distance(e[0].latitude, e[0].longitude, lat | float, lon | float) > 0.05 else 0 -}}
      - &delete_moved
        if:
          - "{{ moved_from | int(0) > 0 }}"
        then:
          - action: script.tesla_delete_schedule
            data: { kind: "{{ kind }}", schedule_id: "{{ moved_from }}" }
      - variables:
          # New schedules get their ID here (the creation time, like the car's own IDs), so the request and
          # the departure event can name it.
          sid: &new_sid >-
            {{ schedule_id if schedule_id | default('') | string != '' and moved_from | int(0) == 0
               else (as_timestamp(now()) | int) | string }}
          old_req: "{{ (state_attr('sensor.tesla_charge_requests', 'requests') or {}).get(schedule_id | default('') | string) }}"
      - variables:
          req: >-
            {%- if charge is not defined -%}{{ old_req -}}
            {%- elif charge and charge_start | default('') -%}
            {{- {'start': charge_start[:5], 'end': (charge_end | default(time, true))[:5],
                 'target': (charge_target | int) if charge_target | default(none) is number else none} -}}
            {%- else -%}{{ none -}}{%- endif -%}
          payload:
            schedule_id: "{{ sid }}"
            name: "{{ name | default('') }}"
            days_of_week: "{{ bits }}"
            precondition_time: "{{ (time.split(':')[0] | int) * 60 + (time.split(':')[1] | int) }}"
            one_time: "{{ one_time | default(true) }}"
            enabled: "{{ enabled | default(true) }}"
            latitude: "{{ lat | float }}"
            longitude: "{{ lon | float }}"
      - &send_or_queue
        action: script.tesla_try_wake
        response_variable: wake
      - if:
          - "{{ wake.awake }}"
        then:
          - action: esphome.tesla_ble_set_precondition_schedule
            data: "{{ payload }}"
          - event: tesla_ble_schedule_queue   # this change supersedes anything queued for the schedule
            event_data: { action: remove, kind: precondition, schedule_id: "{{ sid }}" }
        else:
          - event: tesla_ble_schedule_queue
            event_data: { action: add, kind: precondition, op: set, schedule_id: "{{ sid }}", payload: "{{ payload }}" }
      - event: tesla_ble_departure_changed
        event_data:
          change: saved
          queued: "{{ not wake.awake }}"
          schedule_id: "{{ sid | int }}"
          ready_time: "{{ time }}"
          days: "{{ days }}"
          one_time: "{{ one_time | default(true) }}"
          enabled: "{{ enabled | default(true) }}"
          charge: "{{ req is not none }}"
          charge_start: "{{ req.start if req else none }}"
          charge_end: "{{ req.end if req else none }}"
          charge_target: "{{ req.target if req else none }}"
          latitude: "{{ lat | float }}"
          longitude: "{{ lon | float }}"

  tesla_set_charge_schedule:
    alias: Tesla - add or edit charge schedule
    description: >-
      Adds a charging schedule, or edits the one with the given ID. Charge schedules named `pc:<id>` are
      managed by the linked-charging automation; edit their precondition schedule instead. If the car can't
      be reached, the change is queued and sent when it is next in range.
    icon: mdi:ev-station
    mode: queued
    fields:
      schedule_id:
        name: Schedule ID
        description: Empty adds a new schedule, an existing ID edits it
        selector: { text: }
      name:
        name: Name
        description: Optional
        selector: { text: }
      time:
        name: Start
        required: true
        default: "00:00:00"
        selector: { time: }
      start_enabled:
        name: Use start time
        required: true
        default: true
        selector: { boolean: }
      end_time:
        name: End
        required: true
        default: "06:00:00"
        selector: { time: }
      end_enabled:
        name: Use end time
        required: true
        default: true
        selector: { boolean: }
      days:
        name: Days
        required: true
        default: [Sun, Mon, Tue, Wed, Thu, Fri, Sat]
        selector:
          select:
            multiple: true
            options: [Sun, Mon, Tue, Wed, Thu, Fri, Sat]
      one_time:
        name: One time
        required: true
        default: true
        selector: { boolean: }
      enabled:
        name: Enabled
        required: true
        default: true
        selector: { boolean: }
      location:
        name: Location
        required: true
        default: zone.home
        selector: { entity: { domain: zone } }
      latitude:
        name: Latitude (overrides location)
        selector: { number: { min: -90, max: 90, step: any, mode: box } }
      longitude:
        name: Longitude (overrides location)
        selector: { number: { min: -180, max: 180, step: any, mode: box } }
    sequence:
      - variables: *schedule_common_vars
      - variables:
          kind: charge
      - variables: *moved_vars
      - *delete_moved
      - variables:
          # New schedules get their ID here (the creation time), so a queued one can be edited before upload
          sid: *new_sid
      - variables:
          payload:
            schedule_id: "{{ sid }}"
            name: "{{ name | default('') }}"
            days_of_week: "{{ bits }}"
            start_enabled: "{{ start_enabled | default(true) }}"
            start_time: "{{ (time.split(':')[0] | int) * 60 + (time.split(':')[1] | int) }}"
            end_enabled: "{{ end_enabled | default(true) }}"
            end_time: "{{ (end_time.split(':')[0] | int) * 60 + (end_time.split(':')[1] | int) }}"
            one_time: "{{ one_time | default(true) }}"
            enabled: "{{ enabled | default(true) }}"
            latitude: "{{ lat | float }}"
            longitude: "{{ lon | float }}"
      - *send_or_queue
      - if:
          - "{{ wake.awake }}"
        then:
          - action: esphome.tesla_ble_edit_charge_schedule
            data: "{{ payload }}"
          - event: tesla_ble_schedule_queue
            event_data: { action: remove, kind: charge, schedule_id: "{{ sid }}" }
        else:
          - event: tesla_ble_schedule_queue
            event_data: { action: add, kind: charge, op: set, schedule_id: "{{ sid }}", payload: "{{ payload }}" }
      - event: tesla_ble_schedule_saved   # a one-time schedule is set up again from now
        event_data: { kind: charge, schedule_id: "{{ sid }}" }

  tesla_delete_schedule:
    alias: Tesla - delete schedule
    description: >-
      Deletes one charge or precondition schedule by ID. The list is re-read automatically, and a linked
      charge schedule of a deleted precondition schedule is removed by the linked-charging automation. If the
      car can't be reached, the delete is queued (or, for a schedule that was itself still queued, it is just
      dropped from the queue).
    icon: mdi:delete-clock
    mode: queued
    fields:
      kind:
        name: Schedule type
        required: true
        default: precondition
        selector:
          select:
            options:
              - { label: Precondition, value: precondition }
              - { label: Charge, value: charge }
      schedule_id:
        name: Schedule ID
        required: true
        selector: { text: }
    sequence:
      - *send_or_queue
      - if:
          - "{{ not wake.awake }}"
        then:
          - event: tesla_ble_schedule_queue
            event_data: { action: add, kind: "{{ kind }}", op: delete, schedule_id: "{{ schedule_id }}" }
        else:
          - if:
              - "{{ kind == 'charge' }}"   # compares a field value: no native condition for it
            then:
              - action: esphome.tesla_ble_delete_charge_schedule
                data: { schedule_id: "{{ schedule_id }}" }
            else:
              - action: esphome.tesla_ble_delete_precondition_schedule
                data: { schedule_id: "{{ schedule_id }}" }
          - event: tesla_ble_schedule_queue
            event_data: { action: remove, kind: "{{ kind }}", schedule_id: "{{ schedule_id }}" }
      - if:
          - "{{ kind == 'precondition' }}"
        then:
          - event: tesla_ble_departure_changed
            event_data:
              change: deleted
              schedule_id: "{{ schedule_id | int }}"

  # --------------------------------------------------------------------------- editor: save / delete
  tesla_schedule_editor_save:
    alias: Tesla schedule editor - save
    description: >-
      Saves the schedule in the editor to the car: edits the selected one, or adds a new one. The location
      is the zone picked in the editor, or the schedule's own location when "📍 Keep: …" is picked. For a
      precondition schedule, "also charge" is saved as its charge request. With "External planner", car
      charge schedules at Home are refused (they would fight the planner); other locations are fine.
    icon: mdi:content-save
    mode: single
    sequence:
      - variables:
          sel: "{{ states('input_select.tesla_schedule_select') }}"
          sid: "{{ sel.split('#')[-1] if '#' in sel else '' }}"
          kind: "{{ states('input_select.tesla_schedule_type') }}"
          days: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for d in ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'] -%}
            {%- if is_state('input_boolean.tesla_schedule_day_' ~ d | lower, 'on') -%}{%- set ns.l = ns.l + [d] -%}{%- endif -%}
            {%- endfor -%}
            {{- ns.l -}}
          existing: >-
            {%- set p = state_attr('sensor.tesla_schedule_queue', 'precondition_schedules') -%}{%- set p = p if p is list else state_attr('sensor.tesla_precondition_schedules', 'schedules') -%}
            {%- set c = state_attr('sensor.tesla_schedule_queue', 'charge_schedules') -%}{%- set c = c if c is list else state_attr('sensor.tesla_charge_schedules', 'schedules') -%}
            {%- set all = (p if p is list else []) + (c if c is list else []) -%}
            {{- (all | selectattr('id', 'eq', sid | int(0)) | list | first) | default({}) -}}
          loc_sel: "{{ states('input_select.tesla_schedule_location') }}"
          loc_zone: >-
            {{- states.zone | selectattr('name', 'eq', loc_sel) | map(attribute='entity_id') | first | default('') -}}
      - variables:
          common:
            schedule_id: "{{ sid }}"
            name: "{{ existing.name | default('') }}"
            time: "{{ states('input_datetime.tesla_schedule_time') }}"
            days: "{{ days }}"
            one_time: "{{ is_state('input_boolean.tesla_schedule_one_time', 'on') }}"
            enabled: "{{ is_state('input_boolean.tesla_schedule_enabled', 'on') }}"
            latitude: >-
              {{- state_attr(loc_zone, 'latitude') if loc_zone
                  else existing.latitude | default(state_attr('zone.home', 'latitude')) -}}
            longitude: >-
              {{- state_attr(loc_zone, 'longitude') if loc_zone
                  else existing.longitude | default(state_attr('zone.home', 'longitude')) -}}
      - if:
          - "{{ days | count == 0 }}"
        then:
          - stop: Pick at least one day
            error: true
      - if:
          - condition: state
            entity_id: input_select.tesla_schedule_type
            state: charge
        then:
          - if:
              - condition: state
                entity_id: input_select.tesla_charge_scheduling
                state: External planner
              - "{{ distance(common.latitude, common.longitude, 'zone.home')
                    <= [state_attr('zone.home', 'radius') | default(100) / 1000, 0.5] | max }}"
            then:
              - stop: >-
                  Charge scheduling is set to External planner: a car charge schedule at Home would conflict
                  with it (other locations are fine)
                error: true
          - action: script.tesla_set_charge_schedule
            data: >-
              {{- dict(common,
                      start_enabled=is_state('input_boolean.tesla_schedule_start_enabled', 'on'),
                      end_time=states('input_datetime.tesla_schedule_end'),
                      end_enabled=is_state('input_boolean.tesla_schedule_end_enabled', 'on')) -}}
        else:
          - action: script.tesla_set_precondition_schedule
            data: >-
              {{- dict(common,
                      charge=is_state('input_boolean.tesla_schedule_also_charge', 'on'),
                      charge_start=states('input_datetime.tesla_schedule_charge_start'),
                      charge_end=states('input_datetime.tesla_schedule_end'),
                      charge_target=states('input_number.tesla_schedule_charge_target') | float(0) | int) -}}

  tesla_schedule_editor_delete:
    alias: Tesla schedule editor - delete selected
    description: >-
      Deletes the schedule selected in the editor (only that one). A linked charge schedule of a precondition
      schedule is removed with it by the linked-charging automation.
    icon: mdi:delete
    mode: single
    sequence:
      - variables:
          sel: "{{ states('input_select.tesla_schedule_select') }}"
          kind: "{{ states('input_select.tesla_schedule_type') }}"
      - if:
          - "{{ '#' not in sel }}"
        then:
          - stop: No saved schedule selected
            error: true
      - action: script.tesla_delete_schedule
        data:
          kind: "{{ kind }}"
          schedule_id: "{{ sel.split('#')[-1] }}"

# ----------------------------------------------------------------------------------- automations
automation:
  - id: tesla_schedules_auto_refresh
    alias: Tesla schedules - refresh when the car is awake
    description: >-
      Reads both schedule lists when the car is awake and in BLE range and the last confirmed read is
      older than an hour (or missing). It never wakes the car itself, so it costs no extra battery.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.tesla_ble_asleep
        to: "off"
        for: { seconds: 30 }   # let the infotainment system settle after waking
      - trigger: state
        entity_id: binary_sensor.tesla_ble_ble_status
        to: "on"
        for: { seconds: 30 }   # car came back into range (it may already be awake)
      - trigger: time_pattern
        minutes: "/30"         # catches an awake car whose read went stale while in range
    conditions:
      - condition: state
        entity_id: binary_sensor.tesla_ble_ble_status
        state: "on"
      - condition: state
        entity_id: binary_sensor.tesla_ble_asleep
        state: "off"
      - "{{ (state_attr('sensor.tesla_precondition_schedules', 'read_at') | as_datetime(none)) is none
            or now() - (state_attr('sensor.tesla_precondition_schedules', 'read_at') | as_datetime) > timedelta(hours=1) }}"
    actions:
      - action: esphome.tesla_ble_get_charge_schedules
      - action: esphome.tesla_ble_get_precondition_schedules

  - id: tesla_schedule_queue_upload
    alias: Tesla schedules - upload queued changes
    description: >-
      Sends the changes queued while the car was out of reach (sensor.tesla_schedule_queue), oldest first, as
      soon as the car is in BLE range: waking it when it comes into range or when a change is queued while it is
      in range, so an upcoming departure still gets set even shortly before it. The periodic retry only runs
      while the car is already awake. One-time schedules whose run has passed were already dropped from the queue.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.tesla_ble_ble_status
        to: "on"
        for: { seconds: 30 }
        id: wake
      - trigger: state
        entity_id: sensor.tesla_schedule_queue
        id: wake
      - trigger: state
        entity_id: binary_sensor.tesla_ble_asleep
        to: "off"
        for: { seconds: 30 }
      - trigger: time_pattern
        minutes: "/10"
    conditions:
      - condition: numeric_state
        entity_id: sensor.tesla_schedule_queue
        above: 0
      - condition: state
        entity_id: binary_sensor.tesla_ble_ble_status
        state: "on"
      - condition: or
        conditions:
          - condition: trigger
            id: wake
          - condition: state
            entity_id: binary_sensor.tesla_ble_asleep
            state: "off"
    actions:
      - action: script.tesla_try_wake
        response_variable: wake
      - condition: template
        value_template: "{{ wake.awake }}"
      - repeat:
          for_each: "{{ state_attr('sensor.tesla_schedule_queue', 'pending') or [] }}"
          sequence:
            - choose:
                - conditions: "{{ repeat.item.op == 'delete' and repeat.item.kind == 'charge' }}"
                  sequence:
                    - action: esphome.tesla_ble_delete_charge_schedule
                      data: { schedule_id: "{{ repeat.item.schedule_id }}" }
                - conditions: "{{ repeat.item.op == 'delete' }}"
                  sequence:
                    - action: esphome.tesla_ble_delete_precondition_schedule
                      data: { schedule_id: "{{ repeat.item.schedule_id }}" }
                - conditions: "{{ repeat.item.kind == 'charge' }}"
                  sequence:
                    - action: esphome.tesla_ble_edit_charge_schedule
                      data: "{{ repeat.item.payload }}"
              default:
                - action: esphome.tesla_ble_set_precondition_schedule
                  data: "{{ repeat.item.payload }}"
            - event: tesla_ble_schedule_queue   # only this exact entry: a newer change to the schedule stays queued
              event_data:
                action: remove
                kind: "{{ repeat.item.kind }}"
                schedule_id: "{{ repeat.item.schedule_id }}"
                queued_at: "{{ repeat.item.queued_at }}"

  - id: tesla_one_time_cleanup
    alias: Tesla schedules - delete one-time schedules that have run
    description: >-
      With "Delete after they run" (input_select.tesla_one_time_cleanup): deletes one-time precondition and charge
      schedules from the car 15 minutes after they ran. Only while the car is awake and in BLE range, so it never
      wakes the car for this. Linked charge schedules (`pc:`) are left to the linked-charging automation.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.tesla_schedule_queue   # also re-evaluated every 15 min
      - trigger: state
        entity_id: binary_sensor.tesla_ble_asleep
        to: "off"
        for: { seconds: 30 }
      - trigger: state
        entity_id: input_select.tesla_one_time_cleanup
        to: Delete after they run
    conditions:
      - condition: state
        entity_id: input_select.tesla_one_time_cleanup
        state: Delete after they run
      - condition: state
        entity_id: binary_sensor.tesla_ble_ble_status
        state: "on"
      - condition: state
        entity_id: binary_sensor.tesla_ble_asleep
        state: "off"
    actions:
      - variables:
          done: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for kind, attr in [('precondition', 'precondition_schedules'), ('charge', 'charge_schedules')] -%}
              {%- for s in state_attr('sensor.tesla_schedule_queue', attr) or []
                  if s.ran | default(false) and not s.name | default('') is match('pc:\\d+$')
                     and (s.run_at | as_datetime(now())) < now() - timedelta(minutes=15) -%}
                {%- set ns.l = ns.l + [{'kind': kind, 'schedule_id': s.id | string}] -%}
              {%- endfor -%}
            {%- endfor -%}
            {{- ns.l -}}
      - condition: template
        value_template: "{{ done | count > 0 }}"
      - repeat:
          for_each: "{{ done }}"
          sequence:
            - action: script.tesla_delete_schedule
              data:
                kind: "{{ repeat.item.kind }}"
                schedule_id: "{{ repeat.item.schedule_id }}"

  - id: tesla_linked_charging_reconcile
    alias: Tesla schedules - keep linked charge schedules in step
    description: >-
      With "Car charge schedules": for every precondition schedule with a charge request, keeps a car
      charge schedule named `pc:<precondition id>` with the same days, one-time, enabled and location,
      charging in that window; removes linked charge schedules whose precondition schedule is gone or no
      longer asks for charging. With "External planner": removes all linked charge schedules.
      Other charge schedules are never touched.
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id:
          - sensor.tesla_precondition_schedules
          - sensor.tesla_charge_schedules
        for: { seconds: 5 }   # both lists are usually re-read together after a change
      - trigger: state
        entity_id: input_select.tesla_charge_scheduling
      - trigger: state
        entity_id: sensor.tesla_charge_requests
        for: { seconds: 5 }
    conditions:
      - "{{ state_attr('sensor.tesla_precondition_schedules', 'schedules') is list
            and state_attr('sensor.tesla_charge_schedules', 'schedules') is list }}"
    actions:
      - variables:
          car_mode: "{{ is_state('input_select.tesla_charge_scheduling', 'Car charge schedules') }}"
          pre: "{{ state_attr('sensor.tesla_precondition_schedules', 'schedules') }}"
          ch: "{{ state_attr('sensor.tesla_charge_schedules', 'schedules') }}"
          linked: "{{ ch | selectattr('name', 'match', 'pc:\\d+$') | list }}"
          desired: >-
            {%- set reqs = state_attr('sensor.tesla_charge_requests', 'requests') -%}
            {%- set reqs = reqs if reqs is mapping else {} -%}
            {%- set out = namespace(l=[]) -%}
            {%- if car_mode -%}
            {%- for s in pre -%}
              {%- set rq = reqs.get(s.id | string) -%}
              {%- if rq -%}
                {%- set cur = linked | selectattr('name', 'eq', 'pc:' ~ s.id) | list -%}
                {%- set out.l = out.l + [{
                      'schedule_id': (cur[0].id if cur else s.id + 1) | string,
                      'name': 'pc:' ~ s.id,
                      'start_time': (rq.start[:2] | int) * 60 + (rq.start[3:5] | int),
                      'end_time': (rq.end[:2] | int) * 60 + (rq.end[3:5] | int),
                      'days': s.days, 'one_time': s.one_time, 'enabled': s.enabled,
                      'latitude': s.latitude, 'longitude': s.longitude,
                      'current': cur[0] if cur else none}] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- endif -%}
            {{- out.l -}}
      - variables:
          # A linked schedule needs writing when it is missing or any field differs
          to_set: >-
            {%- set out = namespace(l=[]) -%}
            {%- for d in desired -%}
              {%- set c = d.current -%}
              {%- if c is none or c.start_time != d.start_time or c.end_time != d.end_time or c.days != d.days
                    or c.one_time != d.one_time or c.enabled != d.enabled or not c.start_enabled or not c.end_enabled
                    or (c.latitude - d.latitude) | abs > 0.0001 or (c.longitude - d.longitude) | abs > 0.0001 -%}
                {%- set out.l = out.l + [d] -%}
              {%- endif -%}
            {%- endfor -%}
            {{- out.l -}}
          to_delete: >-
            {{- linked | rejectattr('name', 'in', desired | map(attribute='name') | list) | map(attribute='id') | list -}}
      - if:
          - "{{ to_set | count + to_delete | count == 0 }}"
        then:
          - stop: Linked charge schedules already in step
      - action: script.tesla_ensure_awake
      - repeat:
          for_each: "{{ to_delete }}"
          sequence:
            - action: esphome.tesla_ble_delete_charge_schedule
              data: { schedule_id: "{{ repeat.item | string }}" }
      - repeat:
          for_each: "{{ to_set }}"
          sequence:
            - action: esphome.tesla_ble_edit_charge_schedule
              data:
                schedule_id: "{{ repeat.item.schedule_id }}"
                name: "{{ repeat.item.name }}"
                days_of_week: "{{ repeat.item.days }}"
                start_enabled: true
                start_time: "{{ repeat.item.start_time }}"
                end_enabled: true
                end_time: "{{ repeat.item.end_time }}"
                one_time: "{{ repeat.item.one_time }}"
                enabled: "{{ repeat.item.enabled }}"
                latitude: "{{ repeat.item.latitude }}"
                longitude: "{{ repeat.item.longitude }}"

  - id: tesla_linked_charging_apply_target
    alias: Tesla schedules - set charge limit when a charge window starts
    description: >-
      With "Car charge schedules": when a departure's charge window starts, sets the car's charge limit to
      that departure's charge target, so the linked charge schedule charges to it. Car charge
      schedules cannot hold a limit themselves. Does nothing with "External planner".
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: template
        value_template: >-
          {%- set ns = namespace(on=false) -%}
          {%- for d in (state_attr('sensor.tesla_next_departure', 'all_upcoming') or []) if d.charge and d.charge_target -%}
            {%- if (d.charge_start | as_datetime) <= now() < (d.charge_end | as_datetime) -%}{%- set ns.on = true -%}{%- endif -%}
          {%- endfor -%}
          {{- ns.on -}}
    conditions:
      - condition: state
        entity_id: input_select.tesla_charge_scheduling
        state: Car charge schedules
      - condition: state
        entity_id: binary_sensor.tesla_ble_ble_status
        state: "on"
    actions:
      - variables:
          target: >-
            {%- set ns = namespace(t=none) -%}
            {%- for d in (state_attr('sensor.tesla_next_departure', 'all_upcoming') or []) if d.charge and d.charge_target -%}
              {%- if ns.t is none and (d.charge_start | as_datetime) <= now() < (d.charge_end | as_datetime) -%}
                {%- set ns.t = d.charge_target -%}{%- endif -%}
            {%- endfor -%}
            {{- ns.t -}}
      - if:
          - "{{ target is none or (states('number.tesla_ble_charging_limit') | float(0) | int) == target }}"
        then:
          - stop: Charge limit already at the target
      - action: script.tesla_ensure_awake
      - action: number.set_value
        target:
          entity_id: number.tesla_ble_charging_limit
        data:
          value: "{{ target }}"

  - id: tesla_schedule_editor_sync_list
    alias: Tesla schedule editor - sync list
    description: >-
      Rebuilds the editor's schedule list when the car's schedules or charge requests change, keeping the
      selection. Linked charge schedules are left out (edit their precondition schedule).
    mode: queued
    max_exceeded: silent
    triggers:
      - trigger: state   # no to/from: also fires when only the `schedules` attribute changes
        entity_id:
          - sensor.tesla_precondition_schedules
          - sensor.tesla_charge_schedules
          - sensor.tesla_charge_requests
          - sensor.tesla_schedule_queue
      - trigger: state
        entity_id: input_select.tesla_charge_scheduling
      - trigger: state   # reloading input selects resets the options to the two "New" entries
        entity_id: input_select.tesla_schedule_select
        attribute: options
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          sel: "{{ states('input_select.tesla_schedule_select') }}"
          current_id: "{{ sel.split('#')[-1] if '#' in sel else '' }}"
          reqs: >-
            {%- set r = state_attr('sensor.tesla_charge_requests', 'requests') -%}{{ r if r is mapping else {} -}}
          pre: >-
            {%- set p = state_attr('sensor.tesla_schedule_queue', 'precondition_schedules') -%}{%- set p = p if p is list else state_attr('sensor.tesla_precondition_schedules', 'schedules') -%}{{ p if p is list else [] -}}
          ch: >-
            {%- set c = state_attr('sensor.tesla_schedule_queue', 'charge_schedules') -%}{%- set c = c if c is list else state_attr('sensor.tesla_charge_schedules', 'schedules') -%}{{ c if c is list else [] -}}
          opts: >-
            {%- macro where(s) -%}
            {%- set z = namespace(best='', d=99999) -%}
            {%- for zone in states.zone if zone.attributes.latitude is defined -%}
            {%- set d = distance(s.latitude, s.longitude, zone.entity_id) -%}
            {%- if d is number and d <= [zone.attributes.radius | default(100) / 1000, 0.5] | max and d < z.d -%}
            {%- set z.best = zone.name -%}{%- set z.d = d -%}{%- endif -%}{%- endfor -%}
            {%- set dh = distance(s.latitude, s.longitude, 'zone.home') -%}
            {%- if z.best == state_attr('zone.home', 'friendly_name') -%}{%- elif z.best -%}{{ ' · ' ~ z.best }}
            {%- else -%}{{ ' · Other, ' ~ ((dh | round(1)) if dh < 10 else (dh | round(0) | int)) ~ ' km from Home' }}{%- endif -%}
            {%- endmacro -%}
            {%- macro charge(s) -%}
            {%- set rq = reqs.get(s.id | string) -%}
            {%- if rq -%}{{ ' · 🔌 ' ~ rq.start ~ '–' ~ rq.end ~ ((' ' ~ rq.target ~ '%') if rq.target else '') }}{%- endif -%}
            {%- endmacro -%}
            {%- set ns = namespace(o=['➕ New precondition schedule', '➕ New charge schedule']) -%}
            {%- for s in pre | sort(attribute='precondition_time') -%}
            {%- set ns.o = ns.o + ['🌡️ ' ~ s['*precondition_time'] ~ ' · ' ~ s['*days'] ~ ' · '
                 ~ (('Once, ran' if s.ran | default(false) else 'Once') if s.one_time else 'Weekly') ~ ('' if s.enabled else ' · paused') ~ charge(s) ~ where(s) ~ (' · ⏳' if s.pending | default(false) else '') ~ ' · #' ~ s.id] -%}
            {%- endfor -%}
            {%- for s in ch | rejectattr('name', 'match', 'pc:\\d+$') | sort(attribute='start_time') -%}
            {%- set ns.o = ns.o + ['🔌 ' ~ ((s['*start_time'] ~ '–' ~ s['*end_time']) if s.start_enabled and s.end_enabled
                 else ('from ' ~ s['*start_time']) if s.start_enabled else ('until ' ~ s['*end_time'])) ~ ' · ' ~ s['*days'] ~ ' · '
                 ~ (('Once, ran' if s.ran | default(false) else 'Once') if s.one_time else 'Weekly') ~ ('' if s.enabled else ' · paused') ~ where(s) ~ (' · ⏳' if s.pending | default(false) else '') ~ ' · #' ~ s.id] -%}
            {%- endfor -%}
            {{- ns.o -}}
      - action: input_select.set_options
        target:
          entity_id: input_select.tesla_schedule_select
        data:
          options: "{{ opts }}"
      - variables:
          reselect: >-
            {{- (opts | select('search', '#' ~ current_id ~ '$') | list | first) if current_id != '' else '' -}}
      - if:
          - "{{ reselect not in ['', none] }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.tesla_schedule_select
            data:
              option: "{{ reselect }}"

  - id: tesla_schedule_editor_load_selection
    alias: Tesla schedule editor - load selection
    description: Fills the editor fields with the selected schedule, or with defaults for a new one.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.tesla_schedule_select
        to: ~   # ignore attribute-only changes (option list rebuilds)
    actions:
      - variables:
          sel: "{{ trigger.to_state.state }}"
          sid: "{{ sel.split('#')[-1] if '#' in sel else '' }}"
          pre: >-
            {%- set p = state_attr('sensor.tesla_schedule_queue', 'precondition_schedules') -%}{%- set p = p if p is list else state_attr('sensor.tesla_precondition_schedules', 'schedules') -%}{{ p if p is list else [] -}}
          ch: >-
            {%- set c = state_attr('sensor.tesla_schedule_queue', 'charge_schedules') -%}{%- set c = c if c is list else state_attr('sensor.tesla_charge_schedules', 'schedules') -%}{{ c if c is list else [] -}}
          match_pre: "{{ pre | selectattr('id', 'eq', sid | int(0)) | list }}"
          match_ch: "{{ ch | selectattr('id', 'eq', sid | int(0)) | list }}"
          kind: "{{ 'charge' if (sel == '➕ New charge schedule' or match_ch | count > 0) else 'precondition' }}"
      - variables:
          s: >-
            {%- if match_pre | count > 0 -%}{{ match_pre[0] -}}
            {%- elif match_ch | count > 0 -%}{{ match_ch[0] -}}
            {%- elif kind == 'charge' -%}{{ {'days': 127, 'start_time': 0, 'end_time': 360, 'start_enabled': true,
                                           'end_enabled': true, 'one_time': true, 'enabled': true} -}}
            {%- else -%}{{ {'days': 127, 'precondition_time': 420, 'one_time': true, 'enabled': true} }}{%- endif -%}
      - variables:
          t1: "{{ (s.precondition_time if kind == 'precondition' else s.start_time) | int(0) }}"
          rq: >-
            {{- (state_attr('sensor.tesla_charge_requests', 'requests') or {}).get(sid | string)
                if kind == 'precondition' and sid != '' else none -}}
      - variables:
          also_charge: "{{ rq is not none }}"
          # Charge window of a precondition schedule: its request, else 6 h before the ready time until it
          t_charge_start: >-
            {{- ((rq.start[:2] | int) * 60 + (rq.start[3:5] | int)) if rq else ((t1 - 360) % 1440) -}}
          # Charge target: the request's, else the car's current charge limit
          charge_target: >-
            {{- (rq.target | int) if rq and rq.target
                else ([[states('number.tesla_ble_charging_limit') | float(80) | int, 50] | max, 100] | min) -}}
          t2: >-
            {{- ((rq.end[:2] | int) * 60 + (rq.end[3:5] | int)) if rq
                else (t1 if kind == 'precondition' else s.end_time | default(360) | int(0)) -}}
          zone_names: >-
            {%- set zs = states.zone | selectattr('attributes.latitude', 'defined') | list -%}
            {{- (zs | selectattr('entity_id', 'eq', 'zone.home') | map(attribute='name') | list)
                + (zs | rejectattr('entity_id', 'eq', 'zone.home') | map(attribute='name') | sort | list) -}}
          loc_zone: >-
            {%- set z = namespace(best='', d=99999) -%}
            {%- if s.latitude is defined -%}
            {%- for zone in states.zone if zone.attributes.latitude is defined -%}
            {%- set d = distance(s.latitude, s.longitude, zone.entity_id) -%}
            {%- if d is number and d <= [zone.attributes.radius | default(100) / 1000, 0.5] | max and d < z.d -%}
            {%- set z.best = zone.name -%}{%- set z.d = d -%}{%- endif -%}{%- endfor -%}
            {%- endif -%}
            {{- z.best -}}
      - variables:
          loc_keep: >-
            {%- if s.latitude is defined and loc_zone == '' -%}
            {%- set dh = distance(s.latitude, s.longitude, 'zone.home') -%}
            📍 Keep: Other, {{ (dh | round(1)) if dh < 10 else (dh | round(0) | int) }} km from Home
            {%- endif -%}
      - variables:
          loc_options: "{{ zone_names + ([loc_keep] if loc_keep else []) }}"
          loc_selected: "{{ loc_zone if loc_zone else (loc_keep if loc_keep else zone_names[0]) }}"
          on_list: >-
            {%- set names = ['sun','mon','tue','wed','thu','fri','sat'] -%}
            {%- set ns = namespace(l=[]) -%}
            {%- for i in range(7) -%}{%- if (s.days | int(0) // (2 ** i)) % 2 == 1 -%}
            {%- set ns.l = ns.l + ['input_boolean.tesla_schedule_day_' ~ names[i]] -%}{%- endif -%}{%- endfor -%}
            {%- for flag, on in [('one_time', s.one_time), ('enabled', s.enabled),
                                ('start_enabled', s.start_enabled | default(true)),
                                ('end_enabled', s.end_enabled | default(true)),
                                ('also_charge', also_charge)] -%}
            {%- if on -%}{%- set ns.l = ns.l + ['input_boolean.tesla_schedule_' ~ flag] -%}{%- endif -%}{%- endfor -%}
            {{- ns.l -}}
      - variables:
          off_list: >-
            {%- set all = ['sun','mon','tue','wed','thu','fri','sat']
                         | map('regex_replace', '^', 'input_boolean.tesla_schedule_day_') | list
                         + ['input_boolean.tesla_schedule_one_time', 'input_boolean.tesla_schedule_enabled',
                            'input_boolean.tesla_schedule_start_enabled', 'input_boolean.tesla_schedule_end_enabled',
                            'input_boolean.tesla_schedule_also_charge'] -%}
            {{- all | reject('in', on_list) | list -}}
      - action: input_select.select_option
        target:
          entity_id: input_select.tesla_schedule_type
        data:
          option: "{{ kind }}"
      - action: input_select.set_options
        target:
          entity_id: input_select.tesla_schedule_location
        data:
          options: "{{ loc_options }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.tesla_schedule_location
        data:
          option: "{{ loc_selected }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.tesla_schedule_time
        data:
          time: "{{ '%02d:%02d:00' % ((t1 // 60) % 24, t1 % 60) }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.tesla_schedule_end
        data:
          time: "{{ '%02d:%02d:00' % ((t2 // 60) % 24, t2 % 60) }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.tesla_schedule_charge_start
        data:
          time: "{{ '%02d:%02d:00' % ((t_charge_start // 60) % 24, t_charge_start % 60) }}"
      - action: input_number.set_value
        target:
          entity_id: input_number.tesla_schedule_charge_target
        data:
          value: "{{ charge_target }}"
      - action: input_boolean.turn_on
        target:
          entity_id: "{{ on_list if on_list | count > 0 else 'none' }}"
      - action: input_boolean.turn_off
        target:
          entity_id: "{{ off_list if off_list | count > 0 else 'none' }}"

  - id: tesla_schedule_editor_follow_ready_time
    alias: Tesla schedule editor - move charge window with ready time
    description: >-
      When you change a precondition schedule's ready time in the editor, the charge window moves with it
      (same length, ending at the new ready time) as long as it ended at the old ready time.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_datetime.tesla_schedule_time
        not_to: [unavailable, unknown]
    conditions:
      - condition: state
        entity_id: input_select.tesla_schedule_type
        state: precondition
      - "{{ trigger.to_state.context.user_id is not none }}"   # only your own edits, not the load automation
      - "{{ trigger.from_state is not none and states('input_datetime.tesla_schedule_end') == trigger.from_state.state }}"
    actions:
      - variables:
          old_ready: "{{ (trigger.from_state.state.split(':')[0] | int) * 60 + (trigger.from_state.state.split(':')[1] | int) }}"
          new_ready: "{{ (trigger.to_state.state.split(':')[0] | int) * 60 + (trigger.to_state.state.split(':')[1] | int) }}"
          start: >-
            {%- set t = states('input_datetime.tesla_schedule_charge_start').split(':') -%}
            {{- (t[0] | int) * 60 + (t[1] | int) -}}
      - variables:
          length: "{{ (old_ready - start) % 1440 }}"
      - variables:
          new_start: "{{ (new_ready - length) % 1440 }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.tesla_schedule_end
        data:
          time: "{{ trigger.to_state.state }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.tesla_schedule_charge_start
        data:
          time: "{{ '%02d:%02d:00' % (new_start // 60, new_start % 60) }}"
